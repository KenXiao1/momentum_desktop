name: 🚀 Auto Release

on:
  push:
    branches:
      - main
      - new-feature-branch
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Lint code
        run: npm run lint

      - name: 🚀 Semantic Release (自动检测、构建和发布)
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📢 Notification
        run: |
          echo "✅ Semantic Release 执行完成！如有新版本将自动发布到 GitHub Releases"
          echo "📦 下载地址: https://github.com/${{ github.repository }}/releases/latest"