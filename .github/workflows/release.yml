name: 🚀 Auto Release

on:
  push:
    branches:
      - main
      - new-feature-branch
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: 缓存Electron二进制文件
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Lint code
        run: npm run lint

      - name: 构建应用（优化版本）
        run: npm run build:optimized
        env:
          NODE_ENV: production
      
      - name: 🚀 Semantic Release (自动检测、构建和发布)
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_ENV: production

      - name: 📢 Notification
        run: |
          echo "✅ Semantic Release 执行完成！如有新版本将自动发布到 GitHub Releases"
          echo "📦 下载地址: https://github.com/${{ github.repository }}/releases/latest"