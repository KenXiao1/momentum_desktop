name: 构建和发布桌面应用

on:
  pull_request:
    branches:
      - main
      - new-feature-branch

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 设置Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: 缓存Electron二进制文件
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-
      
      - name: 安装依赖
        run: npm ci
      
      - name: 运行安全检查（不阻断构建）
        run: |
          npm audit --audit-level=high || true
          npm run security:check || true
      
      - name: 运行代码检查（非发布标签时）
        if: startsWith(github.ref, 'refs/tags/v') == false
        continue-on-error: true
        run: |
          echo "在分支构建中跳过严格的lint检查"
          npm run lint || echo "Lint检查发现问题，但不阻塞分支构建"
      
      - name: 构建应用（优化版本）
        run: npm run build:optimized
        env:
          NODE_ENV: production
      
      - name: 构建Electron应用（按优化顺序）
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_ENV: production
      
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: |
            out/*.exe
            out/*.zip
          retention-days: 7
      
      - name: 显示构建产物信息
        run: |
          echo "=== 构建产物列表 ==="
          Get-ChildItem -Path "out" -Recurse | Format-Table Name, Length, LastWriteTime
          echo "=== 文件大小统计 ==="
          $totalSize = (Get-ChildItem -Path "out" -Recurse | Measure-Object -Property Length -Sum).Sum
          echo "总大小: $([math]::Round($totalSize/1MB, 2)) MB"

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 下载所有构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
      
      - name: 整理构建产物
        run: |
          mkdir -p release_files
          find artifacts/ -name "*.exe" -o -name "*.zip" | xargs -I {} cp {} release_files/
          ls -la release_files/
      
      - name: 创建发布说明
        id: release_notes
        run: |
          if [ -f CHANGELOG.md ]; then
            echo "RELEASE_NOTES<<EOF" >> $GITHUB_OUTPUT
            head -n 50 CHANGELOG.md >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "RELEASE_NOTES=自动构建的发布版本" >> $GITHUB_OUTPUT
          fi
      
      - name: 创建GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release_files/*
          body: |
            ## 🚀 新版本发布
            
            ${{ steps.release_notes.outputs.RELEASE_NOTES }}
            
            ### 📦 下载链接
            - **ZIP压缩包**: 绿色免安装版本（推荐）
            - **NSIS安装包**: 完整安装程序（x64/x86）
            - **便携版**: 单文件便携版本
            
            ### ⚡ 性能优化
            - 启用了最大压缩，减少了安装包体积
            - 优化了代码分割和资源加载
            - 移除了开发时的调试代码
            
            ### 🔄 自动更新
            如果您已经安装了之前的版本，应用会自动检测并提示更新。
            
            ### 📝 完整更新日志
            请查看 [提交历史](https://github.com/${{ github.repository }}/commits/${{ github.ref_name }}) 了解详细变更。
          
          tag_name: ${{ github.ref_name }}
          name: Momentum Desktop ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    needs: [build, release]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: 发送构建通知
        run: |
          echo "✅ Momentum Desktop ${{ github.ref_name }} 构建完成！"
          echo "📦 发布地址: https://github.com/enshulv/momentum_desktop/releases/tag/${{ github.ref_name }}"
