# GitHub Release 发布配置
publish:
  provider: github
  owner: enshulv
  repo: momentum_desktop
  releaseType: release

# 自动更新通过应用内的 update-electron-app 处理
# 不需要在 electron-builder 配置中设置 updater

# 更新日志将由 GitHub Actions 自动生成
