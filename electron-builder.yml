appId: com.momentum.desktop
productName: Momentum Desktop
copyright: "MIT License"
asar: true
compression: maximum  # 启用最大压缩
# 启用更强的压缩选项
asarUnpack: 
  - "**/*.{node,dll}"  # 仅解包必要的原生模块
nodeGypRebuild: false  # 禁用原生模块重建
removePackageScripts: true  # 移除 package.json 中的脚本

# 构建目录配置
directories:
  output: dist
  buildResources: public

# 文件包含配置 - 优化后大幅减少包大小
files:
  - "dist/**/*"
  - "electron/**/*"
  - "public/app-icon.ico"
  # 排除所有开发文件和文档
  - "!**/node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme,HISTORY.md,CONTRIBUTORS.md,AUTHORS.md}"
  - "!**/node_modules/*/{test,__tests__,tests,powered-test,example,examples,docs,doc}"
  - "!**/node_modules/*/{*.d.ts,*.flow,*.map,*.ts}"
  - "!**/node_modules/.bin"
  - "!**/node_modules/**/*.{md,txt,yml,yaml,json,lock}"
  - "!**/*.{iml,o,hprof,orig,pyc,pyo,rbc,swp,csproj,sln,xproj}"
  - "!.editorconfig"
  - "!**/._*"
  - "!**/{.DS_Store,.git,.hg,.svn,CVS,RCS,SCCS,.gitignore,.gitattributes}"
  - "!**/{__pycache__,thumbs.db,.flowconfig,.idea,.vs,.nyc_output}"
  - "!**/{appveyor.yml,.travis.yml,circle.yml}"
  - "!**/{npm-debug.log,yarn.lock,.yarn-integrity,.yarn-metadata.json}"
  # 排除大型开发工具和不必要的文件
  - "!**/node_modules/**/{benchmark,coverage,demo,demos,samples,sample}"
  - "!**/node_modules/**/*.{spec.js,test.js,test.ts,spec.ts}"
  - "!**/node_modules/**/Makefile*"
  - "!**/node_modules/**/{.eslintrc*,.prettierrc*,.babelrc*,jest.config*,webpack.config*}"
  - "!**/node_modules/**/src/**/*"
  # 排除语言文件和多语言包
  - "!**/node_modules/**/locale/**/*"
  - "!**/node_modules/**/locales/**/*"
  - "!**/node_modules/**/lang/**/*"
  # 额外排除项以进一步减小体积
  - "!**/node_modules/**/{*.min.js.map,*.css.map}"
  - "!**/node_modules/**/man/**/*"
  - "!**/node_modules/**/docs/**/*"
  - "!**/node_modules/**/{LICENSE*,LICENCE*,license*,licence*}"
  - "!**/node_modules/**/{NOTICE*,notice*}"
  - "!**/node_modules/**/{COPYING*,copying*}"
  - "!**/node_modules/**/{AUTHORS*,authors*}"
  - "!**/node_modules/**/{CONTRIBUTORS*,contributors*}"
  - "!**/node_modules/**/{MAINTAINERS*,maintainers*}"
  - "!**/node_modules/**/{SPONSORS*,sponsors*}"
  - "!**/node_modules/**/{FUNDING*,funding*}"
  - "!**/node_modules/**/{SECURITY*,security*}"
  - "!**/node_modules/**/{CODE_OF_CONDUCT*,code_of_conduct*}"
  - "!**/node_modules/**/.*"
  - "!**/node_modules/**/{*.coffee,*.ts,*.tsx,*.jsx}"
  - "!**/node_modules/**/tsconfig*.json"
  - "!**/node_modules/**/tslint*.json"

# Windows 配置 - 调整构建顺序，优先构建zip
win:
  target:
    - target: zip  # 首先构建压缩包格式
      arch:
        - x64
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: public/app-icon.ico
  requestedExecutionLevel: asInvoker
  artifactName: ${productName}-Setup-${version}.${ext}


# NSIS 安装包配置
nsis:
  oneClick: false                                # 创建辅助安装程序，而不是一键安装
  allowElevation: true                          # 允许请求提升权限
  allowToChangeInstallationDirectory: true     # 允许修改安装目录
  createStartMenuShortcut: true               # 创建开始菜单快捷方式
  createDesktopShortcut: always               # 总是创建桌面快捷方式
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  installerIcon: public/app-icon.ico
  uninstallerIcon: public/app-icon.ico
  installerHeaderIcon: public/app-icon.ico
  deleteAppDataOnUninstall: false             # 卸载时不删除用户数据
  artifactName: ${productName}-Setup-${version}.${ext}
  warningsAsErrors: false
  unicode: true

# 便携版配置  
portable:
  artifactName: ${productName}-Portable-${version}.${ext}

# 暂时只考虑 Windows 平台
# macOS 和 Linux 支持已注释，未来可根据需要启用

